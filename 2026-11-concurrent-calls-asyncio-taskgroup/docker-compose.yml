services:
  upstream:
    build:
      context: .
      target: runtime
    command: ["uvicorn", "upstream.main:app", "--host", "0.0.0.0", "--port", "9000"]
    environment:
      ORDERS_DELAY: "0.2"
      RECOMMENDATIONS_DELAY: "2.0"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9000/health')"]
      interval: 3s
      timeout: 3s
      retries: 10

  app:
    build:
      context: .
      target: runtime
    environment:
      UPSTREAM_URL: http://upstream:9000
      UPSTREAM_TIMEOUT: "0.5"
      MAX_CONCURRENCY: "10"
    ports:
      - "8000:8000"
    depends_on:
      upstream:
        condition: service_healthy

  tests:
    build:
      context: .
      target: test
    profiles: ["tests"]
