name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - 2026-11-cache-aside-fastapi-redis
    steps:
      - uses: actions/checkout@v4
      - name: Build and test
        working-directory: ${{ matrix.project }}
        run: docker compose run --rm --build tests
